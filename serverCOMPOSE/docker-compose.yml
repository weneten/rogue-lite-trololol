services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    environment:
      - DOCKER_API_VERSION=1.45
    command:
      #- "--log.level=DEBUG"
      #- "--accesslog=true"

      # -- Global Settings --
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # FIX: File-Provider für externes Routing (SSH) aktivieren
      - "--providers.file.filename=/dynamic_conf.yml"

      # -- Entrypoints --
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # HTTPS Entrypoints
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=180s"

      - "--entrypoints.subscription.address=:9443"
      - "--entrypoints.subscription.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.subscription.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.subscription.transport.respondingTimeouts.idleTimeout=180s"

      # -- Certificate Resolver (Let's Encrypt) --
      - "--certificatesresolvers.myresolver.acme.email=saturn2005gaming@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=acme.json"
      - "--certificatesresolvers.myresolver.acme.caserver=https://acme-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"

      # -- Global Transport Settings --
      - "--serversTransport.forwardingTimeouts.dialTimeout=30s"
      - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=0"
      - "--serversTransport.forwardingTimeouts.idleConnTimeout=90s"

    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./acme.json:/acme.json"
      # FIX: Die Datei in den Container mounten
      - "./dynamic_conf.yml:/dynamic_conf.yml:ro"
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    networks:
      - proxy
    labels:
      # Hier bleiben NUR die Basis-Labels
      - "traefik.enable=true"

  lnurl-server:
    image: nginx:alpine
    container_name: lnurl-server
    restart: always
    volumes:
      - ./lnurl-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lnurl-data/martin.json:/usr/share/nginx/html/martin.json:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lnurl.rule=Host(`ln.makl.xyz`)"
      - "traefik.http.routers.lnurl.entrypoints=websecure"
      - "traefik.http.routers.lnurl.tls.certresolver=myresolver"
      - "traefik.http.services.lnurl.loadbalancer.server.port=80"

  nightbane:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nightbane
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nightbane.rule=Host(`nb.makl.xyz`)"
      - "traefik.http.routers.nightbane.entrypoints=websecure"
      - "traefik.http.routers.nightbane.tls.certresolver=myresolver"
      - "traefik.http.services.nightbane.loadbalancer.server.port=80"

networks:
  proxy:
    name: proxy
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
        - subnet: fdcc:ad94:bacf:61a3::/64
