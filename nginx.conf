server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include mime.types;
    types {
        application/wasm wasm;
    }
    default_type application/octet-stream;

    # No-threads Godot export: do NOT send COOP/COEP. Those headers are only
    # for SharedArrayBuffer/threaded WASM. Firefox treats require-corp strictly
    # and it adds isolation overhead for no benefit on this build.

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(wasm|pck|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
