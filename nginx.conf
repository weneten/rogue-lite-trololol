server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include mime.types;
    types {
        application/wasm wasm;
    }
    default_type application/octet-stream;

    # Required for Godot 4 web export (SharedArrayBuffer / threads)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript;

    location / {
        try_files $uri $uri/ =404;
    }
}
