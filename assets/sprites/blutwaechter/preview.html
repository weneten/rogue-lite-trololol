const META={"image": "blutwaechter.png", "frameWidth": 64, "frameHeight": 64, "columns": 6, "rows": 10, "facing": "right", "origin": {"x": 30, "y": 58}, "animations": {"idle": {"row": 0, "from": 0, "to": 3, "frames": [0, 1, 2, 3], "frameCount": 4, "fps": 6, "loop": true}, "run": {"row": 1, "from": 6, "to": 11, "frames": [6, 7, 8, 9, 10, 11], "frameCount": 6, "fps": 10, "loop": true}, "shield_bash": {"row": 2, "from": 12, "to": 16, "frames": [12, 13, 14, 15, 16], "frameCount": 5, "fps": 12, "loop": false}, "chain_swing": {"row": 3, "from": 18, "to": 23, "frames": [18, 19, 20, 21, 22, 23], "frameCount": 6, "fps": 16, "loop": false}, "bastion": {"row": 4, "from": 24, "to": 28, "frames": [24, 25, 26, 27, 28], "frameCount": 5, "fps": 10, "loop": false}, "taunt": {"row": 5, "from": 30, "to": 33, "frames": [30, 31, 32, 33], "frameCount": 4, "fps": 8, "loop": false}, "guardian_leap": {"row": 6, "from": 36, "to": 40, "frames": [36, 37, 38, 39, 40], "frameCount": 5, "fps": 14, "loop": false}, "hurt": {"row": 7, "from": 42, "to": 43, "frames": [42, 43], "frameCount": 2, "fps": 10, "loop": false}, "death": {"row": 8, "from": 48, "to": 51, "frames": [48, 49, 50, 51], "frameCount": 4, "fps": 8, "loop": false}, "ultimate": {"row": 9, "from": 54, "to": 59, "frames": [54, 55, 56, 57, 58, 59], "frameCount": 6, "fps": 10, "loop": false}}};
const S=2.5, FW=META.frameWidth, FH=META.frameHeight, COLS=META.columns;
const g=document.getElementById("g");
for(const [name,a] of Object.entries(META.animations)){
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="name">${name}</div>
    <div class="view"></div>
    <div class="meta">${a.frameCount} f @ ${a.fps} fps${a.loop?" loop":""}</div>`;
  const v=card.querySelector(".view");
  v.style.backgroundImage=`url(${SHEET})`;
  v.style.backgroundSize=`${COLS*FW*S}px auto`;
  v.style.width=`${FW*S}px`; v.style.height=`${FH*S}px`;
  let i=0,timer=null;
  const show=()=>{const c=a.frames[i]%COLS, r=a.row;
    v.style.backgroundPosition=`${-c*FW*S}px ${-r*FH*S}px`;};
  const play=()=>{clearInterval(timer); i=0; show();
    timer=setInterval(()=>{i++;
      if(i>=a.frameCount){ if(a.loop){i=0;} else {i=a.frameCount-1; clearInterval(timer);} }
      show();},1000/a.fps);};
  card.onclick=play; g.appendChild(card); play();
}
